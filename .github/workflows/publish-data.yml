name: Export Supabase data and publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static data from Supabase
        run: npm run export:data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push published data
        run: |
          git config user.name "menu-publish-bot"
          git config user.email "actions@github.com"
          # site-data.json + localized images/PDF under public/data
          git add -A public/data
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: publish menu data"
            git push
          fi
